<script>
/* 첫 그림부터 화면 크기에 맞추고, 글꼴·배경이 준비될 때까지 진입 애니메이션을 멈춰 둔다 */
(function () {
  var d = document.documentElement; d.classList.add('ag-wait');
  function fit() { var s = Math.min(innerWidth / 2560, innerHeight / 1440); d.style.setProperty('--ag-s', s); d.style.setProperty('--ag-x', (innerWidth - 2560 * s) / 2 + 'px'); d.style.setProperty('--ag-y', (innerHeight - 1440 * s) / 2 + 'px'); }
  fit(); addEventListener('resize', fit);
  var started = false;
  function start() {
    if (started) return; started = true;
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      d.classList.remove('ag-wait'); d.classList.add('ag-intro');
      setTimeout(function () { d.classList.remove('ag-intro'); }, 2600);
    }); });
  }
  function frame() { return new Promise(function (r) { requestAnimationFrame(function () { r(); }); }); }
  var img = new Image(); img.src = 'assets/bg.jpg';
  var pImg = img.decode ? img.decode().catch(function () {}) : Promise.resolve();
  var pDom = new Promise(function (r) { if (document.readyState !== 'loading') r(); else document.addEventListener('DOMContentLoaded', r); });
  var pFont = pDom.then(frame).then(function () {
    if (!document.fonts) return;
    var f = ['500 20px "Noto Sans KR"', '700 20px "Noto Sans KR"', '900 20px "Noto Sans KR"', '700 20px "Passion One"'];
    return Promise.all(f.map(function (x) { return document.fonts.load(x, '가나다 AFTERGLOW').catch(function () {}); }))
      .then(function () { return document.fonts.ready; });
  });
  Promise.all([pImg, pFont]).then(start, start);
  setTimeout(start, 2500);
  addEventListener('pageshow', function (e) { if (e.persisted) { started = true; d.classList.remove('ag-wait', 'ag-intro'); } });
})();
</script>

.pnl, .strip, #choices, #lobby, #mates { pointer-events: auto; }
.pnl { position: absolute; color: #fff; filter: drop-shadow(0 14px 22px rgba(0,0,0,.35)); }
.pnl::before { content: ""; position: absolute; inset: 0; z-index: -1; clip-path: polygon(0 0, calc(100% - var(--sl, 76px)) 0, 100% 100%, var(--sl, 76px) 100%);
  background: repeating-conic-gradient(rgba(0,0,0,.16) 0 25%, transparent 0 50%) 0 0 / 34px 34px, linear-gradient(90deg, rgba(10,10,10,.94), rgba(74,74,74,.9)); transition: filter .2s; }
.pnl::after { content: ""; position: absolute; left: 0; right: var(--sl, 76px); top: 0; height: 7px; z-index: -1; background: linear-gradient(90deg, rgba(255,255,255,.28), rgba(255,255,255,0)); }
.cap { font-family: "Passion One"; font-size: 34px; letter-spacing: .32em; color: #bdbdbd; }
.big { font-weight: 900; width: fit-content; background: linear-gradient(180deg, #f2f2f2, #8c8c8c); -webkit-background-clip: text; background-clip: text; color: transparent; }
.strip { position: relative; display: inline-flex; white-space: nowrap; text-decoration: none; align-items: center; justify-content: center; height: 86px; padding: 0 64px; font-size: 32px; font-weight: 900; color: #fff; transition: translate .18s, filter .18s; }
.strip::before { content: ""; position: absolute; inset: 0; z-index: -1; clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 100%, 26px 100%); background: linear-gradient(92deg, rgba(255,255,255,.06), rgba(123,123,123,.55) 50%, #171717); }
.strip:hover:not([disabled]) { translate: 8px 0; filter: brightness(1.35); }
.strip[disabled] { opacity: .4; cursor: default; }

#sList, #sMain { padding: 44px 50px; box-sizing: border-box; }
#sList .cap, #sMain .cap { font-size: 26px; }
.rows { position: absolute; left: 30px; right: 20px; top: 110px; bottom: 30px; }
.srow { display: block; width: 100%; text-align: left; padding: 22px 26px; margin-bottom: 14px; color: #fff; background: rgba(255,255,255,.07); border-left: 6px solid transparent; transition: background .2s, translate .18s; }
.srow:hover { translate: 6px 0; background: rgba(255,255,255,.13); }
.srow.on { border-left-color: #f2f2f2; background: rgba(255,255,255,.16); }

.srow small { display: block; margin-top: 6px; font-size: 22px; line-height: 1.4; color: #b5b5b5; }

#sMain .big { font-size: 60px; margin: 2px 0 18px; }
#sLog { position: absolute; left: 50px; right: 30px; top: 190px; bottom: 30px; padding: 10px 30px 40px 0; }
.sl { margin-bottom: 34px; font-size: 32px; line-height: 1.7; font-weight: 500; white-space: pre-wrap; word-break: keep-all; color: #ededed; }
.sl.me { color: #fff; text-align: right; padding-left: 260px; }
.sl.me::before, .sl.other::before { content: attr(data-nm); display: block; font-size: 22px; font-weight: 700; color: #a9a9a9; }
.sl.other { color: #d8e2f2; }
.sl.sys { text-align: center; font-family: "Passion One"; letter-spacing: .2em; font-size: 26px; color: #a9a9a9; }
.sl.typing::after { content: "▍"; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.sl.empty { padding-top: 180px; text-align: center; color: #a9a9a9; }
#choices { display: flex; gap: 20px; flex-wrap: wrap; min-height: 86px; }
#choices .strip { height: 76px; padding: 0 50px; font-size: 28px; }
#stage[data-pg="story"] .field { color: #fff; background: rgba(10,10,10,.72); padding: 0 34px; box-sizing: border-box; height: 86px !important; top: 1220px !important; left: 760px !important; width: 1500px !important; }
.busy #choices, .busy #sendBtn { pointer-events: none; opacity: .5; }
