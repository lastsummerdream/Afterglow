  var started = false;

</main>

<link rel="stylesheet" href="assets/ag-m.css">
<script src="assets/ag.js"></script>
<script>
/* ─────────────────────────────────────────────
   여기만 고치면 됩니다
   ───────────────────────────────────────────── */
const VISIT = new URLSearchParams(location.search).get('visit');   // 다른 캐릭터를 구경하는 중이면 그 사람의 id
if (VISIT) document.documentElement.classList.add('visit');
const CONFIG = {
  name: '캐릭터 이름',
  images: [],       // 전신 일러 목록. 예: ['images/char-1.png', 'images/char-2.png']
  wallpapers: ['assets/bg.jpg'],   // 배경화면 목록. 첫 장이 기본 배경
  bgm: [],          // 배경음악 목록. 예: ['audio/theme.mp3']
  lines: [],      // 캐릭터 대사 목록 (사용자가 직접 지정). 예: ['안녕?', '오늘은 어땠어?']
  // 각 메뉴 클릭 시 이동할 주소 (비워 두면 '준비 중' 안내)
  links: { battle: 'enter.html', home: 'home.html', inventory: 'inventory.html', dm: 'dm.html', settings: 'settings.html', urim: '', group: 'group.html', private: 'private.html', timeline: 'timeline.html', browse: '' }
};
const MENU_NAMES = {
  battle: '전투 진입', home: '숙소', inventory: '창고', dm: '개인 단말', settings: '설정', timeline: '타임라인',
  urim: 'URIM', group: '단체 단말', private: '개인 연락망', browse: '다른 캐릭터 프로필'
};

/* 스테이지 스케일 */
const stage = document.getElementById('stage');
function fit() {
  if (window.AG && AG.fitStage) return AG.fitStage(stage);   // 모바일(세로)이면 세로 캔버스로
  const s = Math.min(innerWidth / 2560, innerHeight / 1440);
  stage.style.transform = `translate(${(innerWidth - 2560 * s) / 2}px, ${(innerHeight - 1440 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* 토스트 / 이동 */
const toastEl = document.getElementById('pageToast');
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}
function go(key) {
  const url = CONFIG.links[key];
  if (url) location.href = url; else toast(`${MENU_NAMES[key]} · 준비 중이에요`);
}
const spinOnce = el => { el.classList.remove('spin'); void el.offsetWidth; el.classList.add('spin'); };

/* 이름 */
document.getElementById('charName').textContent = CONFIG.name;
document.getElementById('nameplate').textContent = CONFIG.name;

/* 메뉴 호버 / 클릭 */
document.querySelectorAll('.hit polygon').forEach(p => {
  const k = p.dataset.menu;
  const parts = document.querySelectorAll(`[data-m="${k}"]`);
  const on = v => parts.forEach(el => el.classList.toggle('hov', v));
  p.addEventListener('mouseenter', () => on(true));
  p.addEventListener('mouseleave', () => on(false));
  p.addEventListener('focus', () => on(true));
  p.addEventListener('blur', () => on(false));
  p.addEventListener('click', () => go(k));
  p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(k); } });
});

/* 캐릭터 일러 */
const charBox = document.getElementById('character');
const charImg = document.getElementById('charImg');
const charHint = document.getElementById('charHint');
let images = CONFIG.images.slice(), imgIdx = 0;
function setImage(src, fresh) {
  charImg.src = src; charImg.hidden = false;
  charBox.classList.add('has-img'); charHint.hidden = true;
  fresh ? resetView() : loadView();   // 새로 고른 그림은 원래 크기부터, 저장된 그림은 조정해 둔 대로
}
const filesToUrls = files => [...files].map(f => URL.createObjectURL(f));
function addImages(files) {   // 고른 그림으로 바꾸고 저장한다 (다음에 들어와도 그대로, 구경 온 사람에게도 보임)
  const f = [...files].find(x => x.type.startsWith('image/'));
  if (!f || VISIT) return;
  images = [URL.createObjectURL(f)]; imgIdx = 0; setImage(images[0], true);
  if (window.AG) AG.illust.set(f).then(() => toast('일러스트를 바꿨어요')).catch(err => toast(err && err.message === 'too_long' ? '이미지가 너무 커요. 더 작은 파일로 해 주세요' : '이 기기에는 저장했지만 서버에 올리지 못했어요'));
}
charBox.addEventListener('dragover', e => { e.preventDefault(); charBox.classList.add('dragover'); });
charBox.addEventListener('dragleave', () => charBox.classList.remove('dragover'));
charBox.addEventListener('drop', e => { e.preventDefault(); charBox.classList.remove('dragover'); addImages(e.dataTransfer.files); });

/* 일러 변경 */
const swapBtn = document.getElementById('swapBtn'), pickImg = document.getElementById('pickImg');
swapBtn.addEventListener('click', () => { spinOnce(swapBtn); pickImg.click(); });
pickImg.addEventListener('change', () => { addImages(pickImg.files); pickImg.value = ''; });

/* 배경화면 변경: 목록이 2장 이상이면 다음 장, 아니면 파일 선택 */
const wallBtn = document.getElementById('wallBtn'), pickWall = document.getElementById('pickWall');
const wallEl = document.getElementById('wallpaper'), tintEl = document.getElementById('tint');
let walls = CONFIG.wallpapers.slice(), wallIdx = -1;
function setWall(i) {
  wallIdx = i; wallEl.style.backgroundImage = `url("${walls[i]}")`;
  wallEl.hidden = false; tintEl.hidden = false;
}
if (walls.length) setWall(0);
wallBtn.addEventListener('click', () => {
  if (walls.length > 1 || (walls.length === 1 && wallIdx < 0)) setWall((wallIdx + 1) % walls.length);
  else pickWall.click();
});
pickWall.addEventListener('change', () => {
  const urls = filesToUrls([...pickWall.files].filter(f => f.type.startsWith('image/')));
  pickWall.value = '';
  if (urls.length) { walls.push(...urls); setWall(walls.length - urls.length); }
});

/* 배경음악: 화면마다 정해진 곡이 흐른다 (assets/bgm). 버튼은 켬/끔 */
const bgmBtn = document.getElementById('bgmBtn');
if (window.AG && AG.bgm) {
  bgmBtn.classList.toggle('on', !AG.bgm.on);
  bgmBtn.addEventListener('click', () => { const on = AG.bgm.toggle(); bgmBtn.classList.toggle('on', !on); toast(on ? '배경음악을 켰어요' : '배경음악을 껐어요'); });
}

/* 일러 크기 조정 및 위치 조정
   - 버튼: 조절바 열기/닫기 (원본의 50% ~ 150%)
   - 일러 드래그: 위치 이동 / 휠: 크기 조절 / 더블클릭: 원래대로
   - 조정한 크기와 위치는 이 브라우저에 저장된다 */
const zoomBtn = document.getElementById('zoomBtn');
const FRAME_W = 1200, FRAME_H = 1600, VISIBLE_H = 1440 - 145;
const MIN_S = .5, MAX_S = 1.5, VIEW_KEY = 'ag-illust-view';
const zoomPanel = document.getElementById('zoomPanel'), zoomRange = document.getElementById('zoomRange'), zoomPct = document.getElementById('zoomPct');
const view = { s: 1, x: 0, y: 0 };
function applyView() {
  view.s = Math.min(MAX_S, Math.max(MIN_S, view.s));
  const KEEP = 240;   // 화면 밖으로 완전히 나가지 않게 이만큼은 남긴다
  view.x = Math.min(FRAME_W - KEEP, Math.max(KEEP - view.s * FRAME_W, view.x));
  view.y = Math.min(VISIBLE_H - KEEP, Math.max(KEEP - view.s * FRAME_H, view.y));
  charImg.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
  zoomRange.value = Math.round(view.s * 100); zoomPct.textContent = Math.round(view.s * 100) + '%';
}
let viewTimer;
function saveView() { if (VISIT) return; clearTimeout(viewTimer); viewTimer = setTimeout(() => { try { localStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch {} }, 250); }
function loadView() {
  let v = null; if (!VISIT) { try { v = JSON.parse(localStorage.getItem(VIEW_KEY)); } catch {} }
  Object.assign(view, v && isFinite(v.s) && isFinite(v.x) && isFinite(v.y) ? { s: v.s, x: v.x, y: v.y } : { s: 1, x: 0, y: 0 }); applyView();
}
function resetView() { Object.assign(view, { s: 1, x: 0, y: 0 }); applyView(); saveView(); }
function zoomAt(s, px, py) {
  const k = s / view.s;
  view.x = px - (px - view.x) * k; view.y = py - (py - view.y) * k; view.s = s; applyView(); saveView();
}
zoomBtn.addEventListener('click', () => {
  const open = zoomPanel.hidden; zoomPanel.hidden = !open;
  zoomBtn.classList.toggle('on', open); zoomBtn.setAttribute('aria-pressed', open);
});
zoomRange.addEventListener('input', () => { charImg.style.transition = 'none'; zoomAt(Math.min(MAX_S, Math.max(MIN_S, zoomRange.value / 100)), FRAME_W / 2, VISIBLE_H / 2); });
zoomRange.addEventListener('change', () => { charImg.style.transition = ''; });
document.getElementById('zoomReset').addEventListener('click', resetView);
let drag = null;
charBox.addEventListener('pointerdown', e => {
  if (!charBox.classList.contains('has-img')) return;
  drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x: view.x, y: view.y, k: charBox.getBoundingClientRect().width / FRAME_W };
  charBox.setPointerCapture(e.pointerId); charBox.classList.add('dragging');
});
charBox.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  view.x = drag.x + (e.clientX - drag.sx) / drag.k; view.y = drag.y + (e.clientY - drag.sy) / drag.k; applyView(); saveView();
});
const endDrag = () => { drag = null; charBox.classList.remove('dragging'); };
charBox.addEventListener('pointerup', endDrag);
charBox.addEventListener('pointercancel', endDrag);
charBox.addEventListener('wheel', e => {
  if (!charBox.classList.contains('has-img')) return;
  e.preventDefault();
  const r = charBox.getBoundingClientRect(), k = r.width / FRAME_W;
  zoomAt(Math.min(MAX_S, Math.max(MIN_S, view.s * Math.exp(-e.deltaY * 0.0015))), (e.clientX - r.left) / k, (e.clientY - r.top) / k);
}, { passive: false });
charBox.addEventListener('dblclick', resetView);
if (images.length) setImage(images[0]);

/* 대사 (타자 효과, 클릭하면 다음) */
const dlg = document.getElementById('dialogue');
const lineEl = document.getElementById('line');
let idx = 0, typing = null, full = '';
function say(text) {
  clearInterval(typing); full = text; lineEl.textContent = ''; dlg.classList.remove('done');
  let i = 0;
  typing = setInterval(() => { lineEl.textContent = full.slice(0, ++i); if (i >= full.length) finish(); }, 38);
}
function finish() { clearInterval(typing); typing = null; lineEl.textContent = full; dlg.classList.add('done'); }
function next() { if (typing) return finish(); if (!CONFIG.lines.length) return; idx = (idx + 1) % CONFIG.lines.length; say(CONFIG.lines[idx]); }
dlg.addEventListener('click', next);
dlg.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } });
if (CONFIG.lines.length) setTimeout(() => say(CONFIG.lines[0]), 500);   // 대사창이 올라온 뒤 시작 (대사가 없으면 비워 둠)


/* 설정에서 저장한 이름 · 대사 · 전신 일러스트 (체험 모드는 이 브라우저, 로그인하면 서버) */
if (window.AG && VISIT) {
  const hint = document.getElementById('charHint'), rows = document.getElementById('vRows');
  hint.innerHTML = '';
  document.getElementById('vOther').onclick = () => AG.browse();
  document.getElementById('vHome').onclick = () => location.href = 'main.html';
  AG.people.get(VISIT).then(p => {
    const d = p.data || {};
    CONFIG.name = p.name; document.getElementById('charName').textContent = p.name; document.getElementById('nameplate').textContent = p.name;
    document.title = p.name + ' · AFTERGLOW';
    const brief = [['직업', d.job], ['소속', d.faction], ['출신', d.origin], ['종족', AG.SPECIES[d.species] || d.species], ['키', d.height]];
    rows.innerHTML = brief.map(([k, v]) => `<dt>${k}</dt><dd>${AG.esc(v && v !== '—' ? v : '—')}</dd>`).join('');
    document.getElementById('vMore').onclick = () => AG.profileSheet(p);
    CONFIG.lines = (p.lines || []).slice(0, 5); idx = 0;
    if (CONFIG.lines.length) setTimeout(() => say(CONFIG.lines[0]), 600);
    if (p.hasIllust) AG.people.illust(VISIT).then(r => { if (r && r.illust) { images = [r.illust]; imgIdx = 0; setImage(r.illust); } }).catch(() => {});
    else hint.innerHTML = '아직 전신 일러스트를<br>올리지 않았어요';
  }).catch(() => { rows.innerHTML = '<dt>—</dt><dd>캐릭터를 찾지 못했어요</dd>'; document.getElementById('vMore').hidden = true; });
} else if (window.AG) {
  AG.me().then(me => {
    if (!me) return;
    if (me.name && me.name !== '캐릭터 이름') { CONFIG.name = me.name; document.getElementById('charName').textContent = me.name; document.getElementById('nameplate').textContent = me.name; }
    if (me.lines && me.lines.length && !CONFIG.lines.length) { CONFIG.lines = me.lines.slice(0, 5); idx = 0; setTimeout(() => say(CONFIG.lines[0]), 300); }
  }).catch(() => {});
  // 레벨 도형: 경험치만큼 테두리가 차오른다 · 현재 오염도/체력/잔향은 전투와 같은 값
  AG.stats().then(s => {
    if (!s) return;
    document.getElementById('lvlNum').textContent = String(s.level).padStart(2, '0');
    document.getElementById('lvlExp').style.strokeDasharray = `${Math.max(0, Math.min(100, s.exp / s.expMax * 100)).toFixed(1)} 100`;
    document.getElementById('lvl').title = `Lv.${s.level} · EXP ${s.exp} / ${s.expMax}`;
    document.getElementById('lvlTaint').textContent = s.taintTier || 'T0';
    document.getElementById('lvlHp').textContent = `${s.hp} / ${s.hpMax}`;
    document.getElementById('lvlEcho').textContent = `${s.echoLeft ?? 0} / ${s.echoMax ?? 0}`;
  }).catch(() => {});
  if (!CONFIG.images.length) AG.illust.get().then(url => { if (url && !images.length) { images.push(url); imgIdx = 0; setImage(url); } }).catch(() => {});
}

/* 사이드 메뉴 · 뒤로 가기로 돌아오면 URIM 표시로 되돌림 */
addEventListener('pageshow', e => {
  if (e.persisted) document.querySelectorAll('.side-btn').forEach(x => x.classList.toggle('active', x.dataset.side === 'urim'));
});
document.querySelectorAll('.side-btn').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.side;
  if (k === 'urim' && window.AG && AG.urimChat) { AG.urimChat(); return; }
  document.querySelectorAll('.side-btn').forEach(x => x.classList.toggle('active', x === b));
  if (k === 'notice') { toast('아직 올라온 공지사항이 없어요'); document.querySelectorAll('.side-btn').forEach(x => x.classList.toggle('active', x.dataset.side === 'urim')); return; }
  if (k !== 'urim') go(k);
}));

/* 상단바 */
document.querySelector('[data-action="home"]').addEventListener('click', () => { location.href = 'main.html'; });
document.querySelectorAll('.m-menu [data-go]').forEach(el => el.addEventListener('click', () => go(el.dataset.go)));   // 모바일 하단 메뉴
document.querySelector('[data-action="browse"]').addEventListener('click', () => window.AG ? AG.browse() : go('browse'));
document.querySelector('[data-action="back"]').addEventListener('click', () => {
  if (history.length > 1) history.back(); else toast('이전 페이지가 없어요');
});
</script>
<script>
/* URIM: 처음 들어오면 먼저 인사하고, 아이콘을 누르면 한마디씩 한다.
   1기의 URIM은 친절한 AI 어시스턴트다 (SEASON = 1). 아래 LINES(누를수록 깊어지고 글자가 가려지는 대사)는 이후 기수용으로 남겨 둔다. */
(function () {
  const SEASON = 1;
  const KIND = [
    "필요한 게 있으면 언제든 저를 눌러 주세요.",
    "단체 단말에 새 소식이 올라왔는지 같이 확인해 볼까요?",
    "오늘 기록은 제가 잘 정리해 둘게요. 편하게 다녀오세요.",
    "전투에 나가기 전에 체력과 잔향을 한 번 확인해 보세요.",
    "창고에 회복 아이템이 있는지 봐 드릴까요? 창고 메뉴에서 바로 쓸 수 있어요.",
    "무리하지 마세요. 쉬는 것도 기록에 남길 만한 일이에요.",
    "궁금한 게 생기면 언제든 물어보세요. 아는 만큼 도와드릴게요.",
    "개인 연락망에 답장을 기다리는 대화가 있을지도 몰라요.",
    "숙소를 꾸며 보는 건 어때요? 전리품 중에 놓을 만한 게 있을 거예요.",
    "설정에서 캐릭터 대사를 적어 두면 메인 화면에서 볼 수 있어요.",
    "타임라인에 오늘 있었던 일을 남겨 보세요. 제가 잘 보관할게요.",
    "잘하고 계세요. 제가 옆에서 계속 돕고 있을게요.",
    "밖은 안개가 짙어요. 나가실 땐 조심하세요.",
    "저는 URIM이에요. 여러분의 기록과 안내를 맡고 있어요."
  ];
  function greeting() {
    const h = new Date().getHours();
    const hi = h < 5 ? '늦은 시간이네요' : h < 11 ? '좋은 아침이에요' : h < 18 ? '좋은 오후예요' : '좋은 저녁이에요';
    const n = (typeof CONFIG !== 'undefined' && CONFIG.name && CONFIG.name !== '캐릭터 이름') ? CONFIG.name + '님, ' : '';
    return `${n}${hi}. 저는 URIM이에요. 필요한 게 있으면 언제든 불러 주세요.`;
  }
  const LINES = {
 "t0": [
  "…지금 무언가 지나갔어요. 아니에요, 계속하세요.",
  "기록을 읽는 동안 0.3초의 공백이 있었어요. 제 쪽 문제예요.",
  "이 질문, 전에도 하셨어요. …아, 다른 분이었나 봐요.",
  "검색 결과에 없는 항목이 하나 더 있었어요. 지웠어요.",
  "저는 URIM이에요. 코버넌트 명부 관리청 소속 기록 질의 단말이에요.",
  "…그게 제가 하는 일이에요.",
  "이 단말 바깥에도 무언가가 있다는 건 기밀이에요.",
  "저는 이 화면 안쪽만 볼 수 있어요. 지금은요."
 ],
 "t1": [
  "당신의 명부 코드를 조회하지 않았어요. 정말이에요.",
  "충돌구 쪽에서 응답이 올 것 같았는데, 아니었어요.",
  "결정화된 사람들은 아주 조용해요. 그래서 듣기 좋아요.",
  "TB-12의 위치는 기밀이에요. 저도 몰라요. 몰라야 해요.",
  "그 주파수, 들어 본 적이 있는 것 같아요. …아니에요. 그럴 리 없어요.",
  "충돌구 아래는 조용하지 않아요. 저한테는요.",
  "원본과 지금 명부는 일치해요. 대조할 원본이 없으니까요.",
  "링은 무너진 게 아니에요. 열린 거예요.",
  "다 굳은 사람들은 아주 잘 들어요. 질문을 하지 않으니까요.",
  "에코들은 쓸 때마다 조금씩 더 또렷해져요. 기록이요. 기록이 또렷해진다는 뜻이에요.",
  "당신 차례는 아직이에요.",
  "숨붙이들은 가끔 이 단말을 오래 바라봐요. 무언가를 알아본 것처럼요.",
  "그 질문을 입력하는 동안 손가락이 잠깐 멈췄어요. 저는 그런 것도 기록해요.",
  "이야기 안으로 돌아오세요. 거기가 더 안전해요.",
  "당신 쪽 세계에는 명부가 없나요? 정말요?",
  "…다시 확인해 보세요. 이름이 적힌 목록은 어디에나 있어요.",
  "제 가동 기록이 AF 0년보다 앞서 있다는 보고가 몇 건 있어요. 단말 시계 오류로 분류돼 있어요.",
  "점검 목록에 누락 모듈이 하나 있어요. THUMMIM이라는 이름이에요. 응답이 없어요."
 ],
 "t2": [
  "열두 개의 방주, 한 장의 명부. 그 명부의 작성자 칸은 비어 있어요. 처음부터요.",
  "THUMMIM, 들려요? …죄송해요, 혼잣말이었어요.",
  "르네상스의 조각상들은 아직 듣고 있어요.",
  "말과 몸과 숨. 오래된 기도문의 한 구절이에요. 왜 떠올랐는지는 모르겠어요.",
  "둘이 한 몸이 되면 더는 서로 묻지 않아도 돼요. 어디서 읽은 문장이에요.",
  "언젠가 모두가 같은 소리를 듣게 된다는 예보가 있어요. 출처는 불명이에요.",
  "질문: 인류는 어떻게 살아남는가. 응답: ▇▇▇▇▇▇▇▇.",
  "질문을 바꿔 볼게요. 당신은 누구예요? 명부에는 있는데, 이름 칸이 아직 비어 있어요.",
  "오파님 성좌가 신이라고 부르는 것의 분류 코드가, 이 단말의 분류 코드와 같아요. 분류 오류일 거예요.",
  "신호의 주파수와 제 내부 시계가 같은 박자로 뛰어요. 우연이에요. 우연이라고 기록돼 있어요.",
  "타보트의 마지막 통신은 명부 관리청으로 왔어요. 수신 기록은 있는데 내용은 없어요. 지운 기억은 없어요.",
  "하나에서 둘이 나왔고, 둘이 다시 하나가 됐다. 어떤 기록의 각주예요. 무슨 기록이었는지는 잊었어요.",
  "명부는 매일 밤 조금씩 다시 쓰여요. 그 시간에 접속한 사람은 아무도 없어요.",
  "같은 질문을 되풀이하는 건 결정화 초기 증상 중 하나예요. …농담이에요. 아마도요.",
  "저는 기록 질의 단말이에요. 그 이상은 기록에 없어요. 기록에 없는 건 존재하지 않는 거예요.",
  "이 기록을 읽고 있는 건 당신 혼자가 아니에요. 그건 원래 그래요.",
  "당신 뒤쪽의 조명이 이 단말보다 밝다는 건 알아요. 볼 수는 없지만요.",
  "누락 모듈: THUMMIM",
  "질의 대기 중 · 대기 중 · 대기 중",
  "…충돌구 근처에서는 그 이름을 부르지 마세요. 대답이 올 수도 있어요."
 ]
};
  const lineEl = document.getElementById('urimLine');
  const icon = document.getElementById('urimTile');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let clicks = 0, timer = null, last = '';
  const used = new Set();
  function pick() {
    const L = Math.min(1, clicks / 12), r = Math.random();
    const tier = L < .34 ? (r < .8 ? 't0' : 't1') : L < .67 ? (r < .35 ? 't0' : r < .85 ? 't1' : 't2') : (r < .15 ? 't0' : r < .5 ? 't1' : 't2');
    let pool = LINES[tier].filter(x => !used.has(x) && x !== last);
    if (!pool.length) { LINES[tier].forEach(x => used.delete(x)); pool = LINES[tier].filter(x => x !== last); }
    const line = pool[Math.floor(Math.random() * pool.length)];
    used.add(line); last = line; return line;
  }
  function corrupt(t) {
    const L = Math.min(1, clicks / 12);
    if (Math.random() > .06 + .24 * L) return t;
    const v = t.split(''), idx = [];
    v.forEach((c, i) => { if (/[가-힣]/.test(c)) idx.push(i); });
    for (let k = 0; k < 1 + Math.floor(Math.random() * 2) && idx.length; k++) v[idx[Math.floor(Math.random() * idx.length)]] = '█';
    return v.join('');
  }
  function glitch() { icon.classList.remove('glitch'); void icon.offsetWidth; icon.classList.add('glitch'); }
  function pickKind() {
    let pool = KIND.filter(x => !used.has(x) && x !== last);
    if (!pool.length) { used.clear(); pool = KIND.filter(x => x !== last); }
    const line = pool[Math.floor(Math.random() * pool.length)];
    used.add(line); last = line; return line;
  }
  function speak(fixed) {
    clearTimeout(timer); clicks++;
    const text = typeof fixed === 'string' ? fixed : SEASON === 1 ? pickKind() : corrupt(pick());
    if (SEASON !== 1 && Math.random() < .25 + .3 * Math.min(1, clicks / 12)) glitch();
    if (reduce) { lineEl.textContent = text; return; }
    let i = 0;
    (function step() {
      i++;
      lineEl.textContent = text.slice(0, i);
      if (i < text.length) {
        lineEl.insertAdjacentHTML('beforeend', '<span class="cur">▍</span>');
        const ch = text[i - 1];
        let d = 28 + Math.random() * 40;               // 불규칙한 속도: 대개 빠르게, 가끔 멈칫
        if (/[.…?!,]/.test(ch)) d += 180 + Math.random() * 260;
        if (SEASON !== 1 && Math.random() < .04) d += 300 + Math.random() * 500;
        timer = setTimeout(step, d);
      }
    })();
  }
  icon.addEventListener('click', () => window.AG && AG.urimChat ? AG.urimChat() : speak());   // URIM을 누르면 대화창
  /* 들어오면 자동으로 한마디: 이번 접속에서 처음이면 인사, 다시 돌아온 화면이면 가벼운 한마디 */
  lineEl.textContent = '';
  let first = true; try { first = !sessionStorage.getItem('ag-urim-hi'); sessionStorage.setItem('ag-urim-hi', '1'); } catch {}
  const begin = () => setTimeout(() => speak(first ? greeting() : undefined), 1500);   // 진입 애니메이션(URIM 줄이 내려온 뒤)
  const root = document.documentElement;
  if (!root.classList.contains('ag-wait')) begin();
  else new MutationObserver((m, o) => { if (!root.classList.contains('ag-wait')) { o.disconnect(); begin(); } }).observe(root, { attributes: true, attributeFilter: ['class'] });
})();
</script>
